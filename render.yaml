# Render Blueprint. In Render: New > Blueprint, pick this repo, then enter the two secrets.
# The database is external (Neon or any Postgres with the pgvector extension).
services:
  - type: web
    name: ytchat
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false # secret: entered in the Render dashboard, never committed
      - key: DATABASE_URL
        sync: false # secret: the Neon connection string
      # YouTube blocks transcript requests from cloud servers, so the demo serves videos
      # indexed beforehand with `ytchat --index` from your own computer.
      - key: ALLOW_NEW_VIDEOS
        value: "false"
      # Render's proxy puts the visitor's IP in X-Forwarded-For; rate limits need it.
      - key: TRUST_PROXY_HEADERS
        value: "true"
