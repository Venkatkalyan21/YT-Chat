[project]
name = "ytchat"
version = "0.1.0"
description = "Chat with YouTube videos: RAG with timestamp-grounded citations, built for evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-google-genai>=4.0",
    "youtube-transcript-api>=1.2",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pgvector>=0.4",
]

[project.optional-dependencies]
# Swap the chat model to Claude with LLM_PROVIDER=anthropic.
anthropic = ["langchain-anthropic>=1.0"]
# Bundled Postgres + pgvector for local development (no Docker or admin rights needed).
local = ["pgserver>=0.1.4; python_version < '3.13'"]
dev = ["pytest>=8"]

[project.scripts]
ytchat = "ytchat.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ytchat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a Postgres database with pgvector"]
