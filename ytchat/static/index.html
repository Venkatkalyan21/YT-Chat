<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YtChat</title>
  <meta name="description" content="Chat with any YouTube video. Timestamped summaries and answers that cite the moments they came from.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b5bd6'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="YtChat home">
      <span class="brand-mark" aria-hidden="true"></span>YtChat
    </a>
    <span id="model-pill" class="pill" hidden></span>
  </header>

  <main>
    <section id="hero" class="hero">
      <h1>Chat with any YouTube video</h1>
      <p class="lede">Paste a link to get a timestamped summary, then ask questions. Every answer cites the moments it came from, so you can jump straight there.</p>
      <form id="load-form" class="load-form">
        <input id="url" type="text" inputmode="url" autocomplete="off" spellcheck="false" required
               placeholder="https://www.youtube.com/watch?v=..." aria-label="YouTube link">
        <button id="load-btn" type="submit">Load video</button>
      </form>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div id="recent" class="recent" hidden>
        <span class="recent-label">Recent</span>
        <div id="recent-list" class="recent-list"></div>
      </div>
    </section>

    <section id="workspace" class="workspace" hidden>
      <div class="col-video">
        <div id="player-wrap" class="player-wrap"><div id="player"></div></div>
        <div class="video-meta">
          <h2 id="video-title"></h2>
          <p id="video-sub" class="muted"></p>
        </div>
        <article class="card">
          <div class="card-head">
            <h2>Summary</h2>
            <button id="regen" class="ghost" type="button">Regenerate</button>
          </div>
          <div id="summary-body" class="md"></div>
        </article>
      </div>

      <div class="col-chat card">
        <div class="card-head">
          <h2>Ask about this video</h2>
          <button id="new-chat" class="ghost" type="button">New chat</button>
        </div>
        <div id="messages" class="messages"></div>
        <form id="ask-form" class="ask-form">
          <textarea id="question" rows="1" placeholder="Ask a question..." aria-label="Your question"></textarea>
          <button id="send-btn" type="submit">Send</button>
        </form>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
