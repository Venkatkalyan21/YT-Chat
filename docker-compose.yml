services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ytchat
      POSTGRES_PASSWORD: ytchat
      POSTGRES_DB: ytchat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ytchat -d ytchat"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ytchat:ytchat@db:5432/ytchat
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
